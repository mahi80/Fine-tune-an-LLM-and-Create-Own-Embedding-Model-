# Qwen2.5-7B-Instruct QLoRA SFT — demo/pipeline-validation run
# Based on Soup's built-in recipe `qwen2.5-7b-sft`.
# For a real fine-tune: point data.train at your own alpaca/chatml JSONL,
# raise epochs to 3 and max_length to 2048.
base: Qwen/Qwen2.5-7B-Instruct
task: sft

data:
  train: ./data/train.jsonl   # run from repo root; absolute paths are safest on Windows
  format: auto
  val_split: 0.1
  max_length: 1024

training:
  epochs: 1
  lr: 2e-4
  batch_size: 2          # fixed: `auto` probe OOM-hard-faults on Windows/WDDM here
  gradient_accumulation_steps: 4
  lora:
    r: 16
    alpha: 32
    target_modules: auto
  quantization: 4bit     # NF4 base + LoRA = QLoRA

output: ./output_qwen7b
